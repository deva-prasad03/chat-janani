<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-blue-500 text-white shadow-lg">
            <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold">Chat App</h1>
                <div class="flex items-center space-x-4">
                    <span id="currentUserDisplay" class="text-sm"></span>
                    <button 
                        onclick="logout()"
                        class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg font-semibold transition"
                    >
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto px-4 py-8">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Select a User to Chat</h2>
            
            <div id="usersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Users will be populated here -->
            </div>
        </main>
    </div>

    <script>
        // Sample users data
        const users = [
            { id: 1, name: 'Alice Johnson', avatar: 'A', status: 'Online' },
            { id: 2, name: 'Bob Smith', avatar: 'B', status: 'Online' },
            { id: 3, name: 'Charlie Brown', avatar: 'C', status: 'Away' },
            { id: 4, name: 'Diana Prince', avatar: 'D', status: 'Online' },
            { id: 5, name: 'Evan Davis', avatar: 'E', status: 'Offline' },
            { id: 6, name: 'Fiona Green', avatar: 'F', status: 'Online' }
        ];

        function checkAuth() {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) {
                window.location.href = 'index.html';
            }
            document.getElementById('currentUserDisplay').textContent = `Logged in as: ${currentUser}`;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('selectedUser');
            localStorage.removeItem('chatMessages');
            window.location.href = 'index.html';
        }

        function loadUsers() {
            const usersList = document.getElementById('usersList');
            usersList.innerHTML = '';
            
            users.forEach(user => {
                const statusColor = user.status === 'Online' ? 'bg-green-500' : 
                                   user.status === 'Away' ? 'bg-yellow-500' : 'bg-gray-500';
                
                const userCard = document.createElement('div');
                userCard.className = 'bg-white rounded-lg shadow-md p-6 hover:shadow-lg hover:scale-105 transition cursor-pointer';
                userCard.onclick = () => startChat(user);
                
                userCard.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="w-16 h-16 bg-blue-500 text-white rounded-full flex items-center justify-center text-2xl font-bold">
                            ${user.avatar}
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-800">${user.name}</h3>
                            <p class="text-sm text-gray-600">${user.id > 3 ? 'Engineering Team' : 'Design Team'}</p>
                            <div class="flex items-center space-x-2 mt-2">
                                <div class="${statusColor} w-3 h-3 rounded-full"></div>
                                <span class="text-xs text-gray-600">${user.status}</span>
                            </div>
                        </div>
                    </div>
                `;
                
                usersList.appendChild(userCard);
            });
        }

        function startChat(user) {
            localStorage.setItem('selectedUser', JSON.stringify(user));
            window.location.href = 'chat.html';
        }

        // Initialize page
        checkAuth();
        loadUsers();
    </script>
</body>
</html>
